
name: Publish SMOI Package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: smoi-package
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish SMOI
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=SMOI
            org.opencontainers.image.description=Just a little guy helping you chat with AI.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Show published package
        shell: bash
        run: |
          echo "Published ${{ steps.image.outputs.name }}:latest" >> "$GITHUB_STEP_SUMMARY"
